[package]
name = "asset-library-desktop"
version = "0.4.0"
edition = "2021"
build = "build.rs"
description = "Native desktop browser for the local 3D asset library (Rust + Slint)"

[dependencies]
slint = { version = "1.18", features = ["raw-window-handle-06"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
ureq = { version = "2", features = ["json"] }
chrono = "0.4"
gltf = "1.4"
base64 = "0.22"
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18"

# Compile speed first: the dev profile exists for the edit/verify loop, not for
# shipping. This crate is unoptimized -- it is what gets rebuilt on every edit --
# while dependencies stay optimized (2), because they are compiled once and own
# the runtime-heavy code (Slint renderer, glTF parsing, ...). `debug = 1` keeps
# line numbers and backtraces but drops the local-variable info that made PDBs
# and incremental sessions multi-GB; incremental is on for this crate only.
[profile.dev]
opt-level = 0
debug = 1
incremental = true

# Dependencies: optimized once, no incremental state (they never change).
[profile.dev.package."*"]
opt-level = 2
debug = 1
incremental = false
